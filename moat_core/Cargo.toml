[package]
name = "moat_core"
version = "0.1.0"
edition = "2021"

[dependencies]
dashmap = "5.5"
tokio = { version = "1.37", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
bincode = "1.3"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dotenvy = "0.15.7"
async-trait = "0.1"
dirs = "5"
rusqlite = "0.39.0"
bit-vec = "0.9.1"
url = "2.5"
serde_yaml = "0.9"
keyring = "3.6"
notify = "6.1"
sha2 = "0.10"
regex = "1"
anyhow = "1.0"
toml = "0.8"
base64 = "0.22"
cap-std = "3.0"
cap-primitives = "3.0"
wasmtime = "25.0.3"
wasmtime-wasi = "25.0.3"
ed25519-dalek = "2.1"
semver = "1.0"
globset = "0.4"
tokio-cron-scheduler = "0.13"
arboard = "3"
enigo = "0.1"
active-win-pos-rs = "0.10"
coreaudio-rs = { version = "0.14", features = ["audio_unit"] }
whisper-rs = { version = "0.11", optional = true }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
coreaudio-sys = "0.2.17"
tiktoken-rs = "0.11.0"

[features]
default = []

[[bin]]
name = "moat-core"
path = "src/main.rs"
whisper = ["whisper-rs"]
