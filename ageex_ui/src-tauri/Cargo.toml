[package]
name = "ageex_ui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "ageex_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.8", features = ["v4"] }
tokio = { version = "1.50.0", features = ["sync", "rt", "macros"] }
dotenvy = "0.15.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = "3"
enigo = "0.1"
arboard = "3"
active-win-pos-rs = "0.10"
accessibility = "0.2"
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics-types = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

# Link to our local Zero-Trust Kernel
moat_core = { path = "../../moat_core" }
ageex_reasoning = { path = "../../crates/ageex_reasoning" }
ageex_wire = { path = "../../crates/ageex_wire" }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
base64 = "0.22"
blake3 = "1"
hex = "0.4"

[features]
default = []
