[package]
name = "moat_watcher"
version = "0.1.0"
edition = "2021"
description = "Window Attention Registry daemon for MoatAgeex — solves the Focus Paradox"

[[bin]]
name = "moat_watcher"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
accessibility = "0.2"
accessibility-sys = "0.2"
active-win-pos-rs = "0.10"
core-foundation = "0.10"
core-graphics-types = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
